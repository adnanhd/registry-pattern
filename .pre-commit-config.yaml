# Mirrors the build.yml lint + typecheck gates so failures are caught before commit.
# Enable once per clone:  pre-commit install
repos:
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 24.10.0
    hooks:
      - id: black

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff

  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        args: ["--ignore=E501,W503,E704"]
        files: ^(registry|tests)/

  # pyright needs the project's installed deps, so run it from the local env.
  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: pyright registry/
        language: system
        types: [python]
        pass_filenames: false
